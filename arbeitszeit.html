<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Arbeitszeit</title>
<style>
  :root{
    --bg: #eef0f2;
    --panel: #ffffff;
    --ink: #1a1d23;
    --ink-soft: #5b6270;
    --line: #dde1e6;
    --slate: #2d3748;
    --slate-soft: #445064;
    --plus: #1e7f5c;
    --plus-bg: #e6f4ee;
    --minus: #b23a2e;
    --minus-bg: #fbeae8;
    --amber: #b8791a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  body{
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
  }
  .wrap{ max-width:560px; margin:0 auto; padding:0 14px; }

  header.top{
    background:var(--slate);
    color:#fff;
    padding:16px 14px calc(14px + env(safe-area-inset-top)) 14px;
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  header.top h1{ margin:0; font-size:19px; font-weight:650; letter-spacing:.2px; }
  .yearbar{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .yearbar .yctl{ display:flex; align-items:center; gap:10px; }
  .yearbar button.arrow{
    background:rgba(255,255,255,.12); border:none; color:#fff; width:34px; height:34px;
    border-radius:8px; font-size:17px; line-height:1; cursor:pointer;
  }
  .yearbar .yearnum{ font-family:var(--mono); font-size:20px; font-variant-numeric: tabular-nums; min-width:52px; text-align:center; }
  .addyear{
    background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff;
    padding:7px 12px; border-radius:8px; font-size:13px; cursor:pointer;
  }

  .dash{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px;
    background:var(--line); border:1px solid var(--line); margin-top:16px;
    border-radius:10px; overflow:hidden;
  }
  .dash .stat{ background:var(--panel); padding:12px 8px; text-align:center; }
  .dash .stat .label{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }
  .dash .stat .value{ font-family:var(--mono); font-variant-numeric: tabular-nums; font-size:17px; font-weight:650; margin-top:4px; }
  .dash .stat .value.plus{ color:var(--plus); }
  .dash .stat .value.minus{ color:var(--minus); }

  .saldo-row{
    margin-top:8px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--ink-soft);
  }
  .saldo-row b{ color:var(--ink); font-weight:600; }
  .saldo-row a{ color:var(--slate-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; }

  main{ margin-top:16px; }

  .month{ background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .month-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; cursor:pointer; user-select:none;
  }
  .month-head .name{ font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; }
  .month-head .chev{ display:inline-block; transition:transform .15s ease; color:var(--ink-soft); font-size:12px; }
  .month.open .month-head .chev{ transform:rotate(90deg); }
  .month-head .badge{
    font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; padding:3px 8px; border-radius:6px;
    background:#eef0f2; color:var(--ink-soft);
  }
  .month-head .badge.plus{ background:var(--plus-bg); color:var(--plus); }
  .month-head .badge.minus{ background:var(--minus-bg); color:var(--minus); }

  .month-body{ display:none; border-top:1px solid var(--line); }
  .month.open .month-body{ display:block; }

  .entry{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .entry:last-of-type{ border-bottom:none; }
  .entry .left .date{ font-size:13.5px; font-weight:600; }
  .entry .left .times{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .entry .right{ text-align:right; }
  .entry .right .worked{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-soft); }
  .entry .right .diff{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13.5px; font-weight:650; margin-top:2px; }
  .entry .right .diff.plus{ color:var(--plus); }
  .entry .right .diff.minus{ color:var(--minus); }
  .entry .right .diff.zero{ color:var(--ink-soft); }

  .empty-hint{ padding:16px 14px; font-size:13px; color:var(--ink-soft); }

  .addbtn{
    display:block; width:calc(100% - 28px); margin:10px 14px 14px 14px;
    background:#f4f5f7; border:1px dashed #c3c9d1; color:var(--slate-soft);
    padding:10px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer;
  }

  .form{ padding:12px 14px 14px 14px; border-bottom:1px solid var(--line); background:#f9fafb; }
  .form .row{ display:flex; gap:8px; margin-bottom:8px; }
  .form .field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .form label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .form input{
    font-family:var(--mono); font-size:15px; padding:8px 9px; border:1px solid var(--line);
    border-radius:7px; background:#fff; color:var(--ink); width:100%;
  }
  .form input::placeholder{ color:#a9b0bb; font-style:italic; }
  .form .hint{ font-size:11.5px; color:var(--amber); margin-top:-4px; margin-bottom:6px; }
  .form .btnrow{ display:flex; gap:8px; margin-top:4px; }
  .form button{ flex:1; padding:10px; border-radius:7px; border:none; font-size:14px; font-weight:650; cursor:pointer; }
  .form .save{ background:var(--slate); color:#fff; }
  .form .delete{ background:var(--minus-bg); color:var(--minus); }
  .form .cancel{ background:#eceef1; color:var(--ink-soft); }

  footer.info{ text-align:center; color:var(--ink-soft); font-size:11.5px; padding:18px 14px 6px 14px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Arbeitszeit</h1>
    <div class="yearbar">
      <div class="yctl">
        <button class="arrow" id="prevYear">‹</button>
        <div class="yearnum" id="yearLabel">2026</div>
        <button class="arrow" id="nextYear">›</button>
      </div>
      <button class="addyear" id="addYearBtn">+ Jahr</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="dash">
    <div class="stat">
      <div class="label">Gearbeitet</div>
      <div class="value" id="statWorked">0,00 h</div>
    </div>
    <div class="stat">
      <div class="label">Saldo</div>
      <div class="value" id="statSaldo">0,00 h</div>
    </div>
    <div class="stat">
      <div class="label">Bester Monat</div>
      <div class="value" id="statBest">–</div>
    </div>
  </div>

  <div class="saldo-row" id="saldoRow">
    <span>Start-Saldo: <b id="saldoStartVal">0,00 h</b></span>
    <a id="saldoEditLink">ändern</a>
  </div>

  <main id="months"></main>

  <footer class="info">Läuft komplett offline · Daten bleiben nur auf diesem Gerät</footer>
</div>

<script>
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const STORAGE_KEY = "arbeitszeit_data_v1";

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const data = { targetHours: 7.6, years: {} };
  data.years["2026"] = {
    startSaldoOverride: 0,
    entries: {
      "2026-09-01": { start: "08:00", end: "16:31", pause: 34 },
      "2026-09-02": { start: "08:00", end: "15:00", pause: 30 }
    }
  };
  return data;
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }

const state = {
  data: loadData(),
  currentYear: null,
  openMonths: new Set(),
  editing: null // {year, month, dateKey|null}
};
state.currentYear = Object.keys(state.data.years).sort().slice(-1)[0];

function pad2(n){ return String(n).padStart(2,"0"); }
function timeToHours(t){
  if(!t) return null;
  const parts = t.split(":");
  if(parts.length < 2) return null;
  const h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if(isNaN(h) || isNaN(m)) return null;
  return h + m/60;
}
function hoursToTimeStr(hDecimal){
  let h = Math.floor(hDecimal);
  let m = Math.round((hDecimal - h) * 60);
  if(m === 60){ m = 0; h += 1; }
  h = ((h % 24) + 24) % 24;
  return pad2(h) + ":" + pad2(m);
}
function fmtSigned(n){
  const r = Math.round(n * 100) / 100;
  if(r === 0) return "0,00 h";
  const sign = r > 0 ? "+" : "-";
  const abs = Math.abs(r);
  return sign + abs.toFixed(2).replace(".", ",") + " h";
}
function fmtPlain(n){
  const r = Math.round(n * 100) / 100;
  return r.toFixed(2).replace(".", ",") + " h";
}
function calcEntry(entry){
  const s = timeToHours(entry.start);
  const e = timeToHours(entry.end);
  if(s == null || e == null) return null;
  const pause = Number(entry.pause) || 0;
  let worked = (e - s) - pause/60;
  if(worked < 0) worked += 24;
  const diff = worked - state.data.targetHours;
  return { worked, diff };
}
function suggestedEnd(entry){
  const s = timeToHours(entry.start);
  if(s == null) return null;
  const pause = Number(entry.pause) || 0;
  return hoursToTimeStr(s + pause/60 + state.data.targetHours);
}
function ensureYear(y){
  if(!state.data.years[y]){
    state.data.years[y] = { startSaldoOverride: null, entries: {} };
  }
  return state.data.years[y];
}
function getStartSaldo(y, guard){
  guard = guard || new Set();
  if(guard.has(y)) return 0;
  guard.add(y);
  const yr = state.data.years[y];
  if(!yr) return 0;
  if(yr.startSaldoOverride !== null && yr.startSaldoOverride !== undefined){
    return yr.startSaldoOverride;
  }
  const prev = String(Number(y) - 1);
  if(state.data.years[prev]){
    return getYearFinalBalance(prev, guard);
  }
  return 0;
}
function getMonthEntries(y, monthIdx){
  const yr = state.data.years[y];
  if(!yr) return [];
  const prefix = y + "-" + pad2(monthIdx+1);
  return Object.keys(yr.entries)
    .filter(k => k.startsWith(prefix))
    .sort()
    .map(k => [k, yr.entries[k]]);
}
function getMonthDiffSum(y, monthIdx){
  let sum = 0, worked = 0;
  getMonthEntries(y, monthIdx).forEach(([k, entry]) => {
    const c = calcEntry(entry);
    if(c){ sum += c.diff; worked += c.worked; }
  });
  return { diff: sum, worked };
}
function getYearFinalBalance(y, guard){
  let bal = getStartSaldo(y, guard);
  for(let m=0; m<12; m++){
    bal += getMonthDiffSum(y, m).diff;
  }
  return bal;
}
function getYearStats(y){
  let totalWorked = 0, best = null;
  for(let m=0; m<12; m++){
    const {diff, worked} = getMonthDiffSum(y, m);
    totalWorked += worked;
    if(worked > 0 && (!best || worked > best.worked)) best = { name: MONTHS[m], worked };
  }
  return { totalWorked, finalBalance: getYearFinalBalance(y), best };
}

function render(){
  document.getElementById("yearLabel").textContent = state.currentYear;
  const stats = getYearStats(state.currentYear);
  document.getElementById("statWorked").textContent = fmtPlain(stats.totalWorked);
  const saldoEl = document.getElementById("statSaldo");
  saldoEl.textContent = fmtSigned(stats.finalBalance);
  saldoEl.className = "value " + (stats.finalBalance > 0.001 ? "plus" : stats.finalBalance < -0.001 ? "minus" : "");
  document.getElementById("statBest").textContent = stats.best ? stats.best.name : "–";

  const yr = ensureYear(state.currentYear);
  const prevYear = String(Number(state.currentYear) - 1);
  const auto = yr.startSaldoOverride === null || yr.startSaldoOverride === undefined;
  const startVal = getStartSaldo(state.currentYear);
  document.getElementById("saldoStartVal").textContent = fmtSigned(startVal) + (auto && state.data.years[prevYear] ? "  (aus " + prevYear + ")" : "");
  document.getElementById("saldoEditLink").textContent = auto ? "manuell setzen" : "zurücksetzen (auto)";

  const monthsEl = document.getElementById("months");
  monthsEl.innerHTML = "";
  MONTHS.forEach((name, idx) => {
    const key = state.currentYear + "-" + idx;
    const isOpen = state.openMonths.has(key);
    const {diff} = getMonthDiffSum(state.currentYear, idx);
    const entries = getMonthEntries(state.currentYear, idx);

    const monthDiv = document.createElement("div");
    monthDiv.className = "month" + (isOpen ? " open" : "");

    const head = document.createElement("div");
    head.className = "month-head";
    const roundedDiff = Math.round(diff*100)/100;
    const badgeClass = entries.length === 0 ? "" : (roundedDiff > 0.001 ? "plus" : roundedDiff < -0.001 ? "minus" : "");
    head.innerHTML = `<span class="name"><span class="chev">▸</span>${name}</span>` +
      (entries.length ? `<span class="badge ${badgeClass}">${fmtSigned(diff)}</span>` : `<span class="badge">–</span>`);
    head.addEventListener("click", () => {
      if(state.openMonths.has(key)) state.openMonths.delete(key);
      else state.openMonths.add(key);
      render();
    });
    monthDiv.appendChild(head);

    const body = document.createElement("div");
    body.className = "month-body";

    if(isOpen){
      if(state.editing && state.editing.year === state.currentYear && state.editing.month === idx){
        body.appendChild(buildForm(state.editing));
      }

      if(entries.length === 0 && !(state.editing && state.editing.year===state.currentYear && state.editing.month===idx)){
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "Noch keine Einträge in " + name + ".";
        body.appendChild(hint);
      }

      entries.forEach(([dateKey, entry]) => {
        const c = calcEntry(entry);
        const row = document.createElement("div");
        row.className = "entry";
        const d = new Date(dateKey + "T00:00:00");
        const dateLabel = pad2(d.getDate()) + "." + pad2(d.getMonth()+1) + ".";
        const timesLabel = (entry.start||"–") + "–" + (entry.end||"–") + (entry.pause ? "  ·  " + entry.pause + " min" : "");
        const diffClass = !c ? "" : (c.diff > 0.001 ? "plus" : c.diff < -0.001 ? "minus" : "zero");
        row.innerHTML = `
          <div class="left">
            <div class="date">${dateLabel}</div>
            <div class="times">${timesLabel}</div>
          </div>
          <div class="right">
            <div class="worked">${c ? fmtPlain(c.worked) : "–"}</div>
            <div class="diff ${diffClass}">${c ? fmtSigned(c.diff) : "offen"}</div>
          </div>`;
        row.addEventListener("click", () => {
          state.editing = { year: state.currentYear, month: idx, dateKey };
          render();
        });
        body.appendChild(row);
      });

      if(!(state.editing && state.editing.year===state.currentYear && state.editing.month===idx)){
        const addBtn = document.createElement("button");
        addBtn.className = "addbtn";
        addBtn.textContent = "+ Eintrag hinzufügen";
        addBtn.addEventListener("click", () => {
          state.editing = { year: state.currentYear, month: idx, dateKey: null };
          render();
        });
        body.appendChild(addBtn);
      }
    }

    monthDiv.appendChild(body);
    monthsEl.appendChild(monthDiv);
  });
}

function buildForm(ctx){
  const yr = ensureYear(ctx.year);
  const isNew = ctx.dateKey === null;
  const entry = isNew ? { start:"", end:"", pause:"" } : yr.entries[ctx.dateKey];

  const wrap = document.createElement("div");
  wrap.className = "form";

  let defaultDate = ctx.dateKey;
  if(isNew){
    const existing = getMonthEntries(ctx.year, ctx.month).map(([k]) => k);
    const lastDay = new Date(Number(ctx.year), ctx.month+1, 0).getDate();
    let day = 1;
    if(existing.length) day = Math.min(lastDay, parseInt(existing[existing.length-1].slice(-2),10) + 1);
    defaultDate = ctx.year + "-" + pad2(ctx.month+1) + "-" + pad2(day);
  }

  const minDate = ctx.year + "-" + pad2(ctx.month+1) + "-01";
  const lastDay = new Date(Number(ctx.year), ctx.month+1, 0).getDate();
  const maxDate = ctx.year + "-" + pad2(ctx.month+1) + "-" + pad2(lastDay);

  wrap.innerHTML = `
    <div class="row">
      <div class="field">
        <label>Datum</label>
        <input type="date" id="f_date" value="${defaultDate}" min="${minDate}" max="${maxDate}">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Start</label>
        <input type="time" id="f_start" value="${entry.start||""}">
      </div>
      <div class="field">
        <label>Pause (Min)</label>
        <input type="number" id="f_pause" placeholder="0" value="${entry.pause||""}">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Ende</label>
        <input type="time" id="f_end" value="${entry.end||""}">
      </div>
    </div>
    <div class="hint" id="f_hint" style="display:none;"></div>
    <div class="btnrow">
      ${isNew ? "" : '<button class="delete" id="f_delete">Löschen</button>'}
      <button class="cancel" id="f_cancel">Abbrechen</button>
      <button class="save" id="f_save">Speichern</button>
    </div>
  `;

  function updateHint(){
    const startVal = wrap.querySelector("#f_start").value;
    const endVal = wrap.querySelector("#f_end").value;
    const pauseVal = wrap.querySelector("#f_pause").value;
    const hintEl = wrap.querySelector("#f_hint");
    if(startVal && !endVal){
      const sug = suggestedEnd({start:startVal, pause:pauseVal});
      if(sug){
        hintEl.style.display = "block";
        hintEl.textContent = "Frühestens Feierabend: " + sug + " (für " + state.data.targetHours.toString().replace(".",",") + "h)";
        return;
      }
    }
    hintEl.style.display = "none";
  }
  wrap.querySelector("#f_start").addEventListener("input", updateHint);
  wrap.querySelector("#f_pause").addEventListener("input", updateHint);
  wrap.querySelector("#f_end").addEventListener("input", updateHint);
  setTimeout(updateHint, 0);

  wrap.querySelector("#f_cancel").addEventListener("click", () => {
    state.editing = null;
    render();
  });

  if(!isNew){
    wrap.querySelector("#f_delete").addEventListener("click", () => {
      delete yr.entries[ctx.dateKey];
      state.editing = null;
      saveData();
      render();
    });
  }

  wrap.querySelector("#f_save").addEventListener("click", () => {
    const dateVal = wrap.querySelector("#f_date").value;
    const startVal = wrap.querySelector("#f_start").value;
    const endVal = wrap.querySelector("#f_end").value;
    const pauseVal = parseInt(wrap.querySelector("#f_pause").value, 10) || 0;
    if(!dateVal || !startVal){
      alert("Bitte mindestens Datum und Start eintragen.");
      return;
    }
    if(!isNew && dateVal !== ctx.dateKey) delete yr.entries[ctx.dateKey];
    yr.entries[dateVal] = { start: startVal, end: endVal, pause: pauseVal };
    state.editing = null;
    saveData();
    render();
  });

  return wrap;
}

document.getElementById("prevYear").addEventListener("click", () => {
  state.currentYear = String(Number(state.currentYear) - 1);
  ensureYear(state.currentYear);
  state.editing = null;
  render();
});
document.getElementById("nextYear").addEventListener("click", () => {
  state.currentYear = String(Number(state.currentYear) + 1);
  ensureYear(state.currentYear);
  state.editing = null;
  render();
});
document.getElementById("addYearBtn").addEventListener("click", () => {
  const suggestion = String(Number(state.currentYear) + 1);
  const input = prompt("Neues Jahr anlegen:", suggestion);
  if(!input) return;
  const y = String(parseInt(input, 10));
  if(!y || y === "NaN") return;
  ensureYear(y);
  state.currentYear = y;
  saveData();
  render();
});
document.getElementById("saldoEditLink").addEventListener("click", () => {
  const yr = ensureYear(state.currentYear);
  const auto = yr.startSaldoOverride === null || yr.startSaldoOverride === undefined;
  if(auto){
    const current = getStartSaldo(state.currentYear);
    const input = prompt("Start-Saldo für " + state.currentYear + " (in Stunden, z. B. 12,5):", String(current).replace(".",","));
    if(input === null) return;
    const num = parseFloat(input.replace(",", "."));
    if(isNaN(num)) return;
    yr.startSaldoOverride = num;
  } else {
    yr.startSaldoOverride = null;
  }
  saveData();
  render();
});

render();
</script>
</body>
</html>
